<style>
/* Grid gallery: equal cells, full images */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 15px;
}

.gallery-grid img {
  width: 100%;
  height: 250px;        /* all images same height */
  object-fit: contain;   /* shows entire image, adds padding if needed */
  background-color: #f8f9fa; /* optional: background for padding areas */
  border-radius: 0.25rem;
  transition: transform 0.3s ease;
}

.gallery-grid img:hover {
  transform: scale(1.03);
}

/* Responsive adjustments */
@media (max-width: 768px) {
  .gallery-grid img {
    height: 200px;
  }
}

@media (max-width: 576px) {
  .gallery-grid img {
    height: 150px;
  }
}
</style>
</head>
