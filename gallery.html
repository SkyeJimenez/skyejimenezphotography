<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Skye Jimenez Photography</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* ===== GRID LAYOUT ===== */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 15px;
}

/* ===== IMAGE STYLE ===== */
.gallery-img {
  width: 100%;
  height: 250px;
  object-fit: contain;
  background: #f8f9fa;
  padding: 5px;
  border-radius: 6px;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.gallery-img:hover {
  transform: scale(1.03);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .gallery-img { height: 200px; }
}

@media (max-width: 576px) {
  .gallery-img { height: 150px; }
}

/* ===== LIGHTBOX ===== */
.lightbox {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  align-items: center;
  justify-content: center;
}

.lightbox-content {
  max-width: 90%;
  max-height: 80vh;
  border-radius: 8px;
}

.close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  color: white;
  cursor: pointer;
}

.search-box {
  margin-bottom: 20px;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Skye Jimenez Photography</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- SEARCH + CONTROLS -->
<div class="container my-4 text-center">

  <h2 class="mb-3">Photo Gallery</h2>

  <!-- SEARCH -->
  <input 
    type="text" 
    id="searchInput" 
    class="form-control search-box"
    placeholder="Search photos..."
  >

  <!-- FILTER BUTTONS -->
  <div class="mb-3">
    <button class="btn btn-outline-dark btn-sm" onclick="filterItems('all')">All</button>
    <button class="btn btn-outline-dark btn-sm" onclick="filterItems('action')">Action</button>
    <button class="btn btn-outline-dark btn-sm" onclick="filterItems('team')">Team</button>
    <button class="btn btn-outline-dark btn-sm" onclick="filterItems('portrait')">Portrait</button>
  </div>

  <!-- SORT -->
  <button class="btn btn-primary btn-sm" onclick="sortItems()">Sort A-Z</button>

</div>

<!-- GALLERY -->
<main class="container my-4">

  <div class="gallery-grid" id="itemContainer">

    <div class="item" data-category="action">
      <img src="soccer1.jpg" class="gallery-img" alt="soccer action goal">
      <p class="text-center">Goal Action Shot</p>
    </div>

    <div class="item" data-category="team">
      <img src="soccer2.jpg" class="gallery-img" alt="team huddle">
      <p class="text-center">Team Huddle</p>
    </div>

    <div class="item" data-category="portrait">
      <img src="soccer3.jpg" class="gallery-img" alt="portrait">
      <p class="text-center">Player Portrait</p>
    </div>

    <div class="item" data-category="action">
      <img src="soccer4.jpg" class="gallery-img" alt="action shot">
      <p class="text-center">Game Action</p>
    </div>

    <div class="item" data-category="team">
      <img src="soccer5.jpg" class="gallery-img" alt="team celebration">
      <p class="text-center">Team Celebration</p>
    </div>

    <div class="item" data-category="portrait">
      <img src="soccer6.jpg" class="gallery-img" alt="athlete portrait">
      <p class="text-center">Athlete Portrait</p>
    </div>

  </div>
</main>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <span class="close">&times;</span>
  <img class="lightbox-content" id="lightbox-img">
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-5">
  &copy; 2026 Skye Jimenez Photography
</footer>

<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- LIGHTBOX SCRIPT -->
<script>
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const closeBtn = document.querySelector(".close");

document.querySelectorAll(".gallery-img").forEach(img => {
  img.addEventListener("click", function () {
    lightbox.style.display = "flex";
    lightboxImg.src = this.src;
  });
});

closeBtn.onclick = function () {
  lightbox.style.display = "none";
};

lightbox.onclick = function (e) {
  if (e.target === lightbox) {
    lightbox.style.display = "none";
  }
};
</script>

<!-- YOUR MAIN SCRIPT (FIXED PATH) -->
<script src="script.js"></script>

</body>
</html>
