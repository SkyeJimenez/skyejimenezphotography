<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Skye Jimenez Photography</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* ===== GRID LAYOUT ===== */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 15px;
}

/* ===== GALLERY IMAGES ===== */
.gallery-img {
  width: 100%;
  height: 250px;
  object-fit: contain;
  background: #f8f9fa;
  padding: 5px;
  border-radius: 6px;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.gallery-img:hover {
  transform: scale(1.03);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .gallery-img { height: 200px; }
}

@media (max-width: 576px) {
  .gallery-img { height: 150px; }
}

/* ===== LIGHTBOX ===== */
.lightbox {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  align-items: center;
  justify-content: center;
}

/* LIGHTBOX IMAGE */
.lightbox-content {
  max-width: 90%;
  max-height: 80vh;
  border-radius: 8px;
}

/* CLOSE BUTTON */
.close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  color: white;
  cursor: pointer;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Skye Jimenez Photography</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- GALLERY -->
<main class="container my-5">
  <h2 class="text-center mb-4">Photo Gallery</h2>

  <div class="gallery-grid">

    <img src="soccer1.jpg" class="gallery-img" alt="Soccer 1">
    <img src="soccer2.jpg" class="gallery-img" alt="Soccer 2">
    <img src="soccer3.jpg" class="gallery-img" alt="Soccer 3">
    <img src="soccer4.jpg" class="gallery-img" alt="Soccer 4">
    <img src="soccer5.jpg" class="gallery-img" alt="Soccer 5">
    <img src="soccer6.jpg" class="gallery-img" alt="Soccer 6">
    <img src="soccer7.jpg" class="gallery-img" alt="Soccer 7">
    <img src="soccer8.jpg" class="gallery-img" alt="Soccer 8">
    <img src="soccer9.jpg" class="gallery-img" alt="Soccer 9">
    <img src="soccer10.jpg" class="gallery-img" alt="Soccer 10">
    <img src="soccer11.jpg" class="gallery-img" alt="Soccer 11">
    <img src="soccer12.jpg" class="gallery-img" alt="Soccer 12">
    <img src="soccer13.jpg" class="gallery-img" alt="Soccer 13">
    <img src="soccer14.jpg" class="gallery-img" alt="Soccer 14">
    <img src="soccer15.jpg" class="gallery-img" alt="Soccer 15">

  </div>
</main>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <span class="close">&times;</span>
  <img class="lightbox-content" id="lightbox-img">
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-5">
  &copy; 2026 Skye Jimenez Photography
</footer>

<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- LIGHTBOX SCRIPT -->
<script>
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const closeBtn = document.querySelector(".close");

// open image
document.querySelectorAll(".gallery-img").forEach(img => {
  img.addEventListener("click", function () {
    lightbox.style.display = "flex";
    lightboxImg.src = this.src;
  });
});

// close button
closeBtn.onclick = function () {
  lightbox.style.display = "none";
};

// click outside image closes
lightbox.onclick = function (e) {
  if (e.target === lightbox) {
    lightbox.style.display = "none";
  }
};
</script>

</body>
</html>
