<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Skye Jimenez Photography</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- CONTACT FORM -->
<main class="container my-5">
  <h2 class="text-center mb-4">Contact Me</h2>

  <form id="contactForm" class="mx-auto p-4 border rounded shadow-sm bg-light" style="max-width:500px;">

    <!-- NAME -->
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" id="name" class="form-control" required>
    </div>

    <!-- EMAIL -->
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" class="form-control" required>
    </div>

    <!-- MESSAGE -->
    <div class="mb-3">
      <label for="message" class="form-label">Message</label>
      <textarea id="message" class="form-control" rows="5" required></textarea>
    </div>

    <!-- ERROR MESSAGE -->
    <p id="errorMsg" class="text-danger small mt-2"></p>

    <!-- SUBMIT -->
    <button type="submit" class="btn btn-primary w-100">
      Send Message
    </button>

  </form>
</main>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-5">
