<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skye Jimenez Photography</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <img src="20.png" alt="Skye Jimenez Photography" style="height: 50px;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- HERO -->
<header class="position-relative text-center text-white" style="height: 60vh; overflow: hidden;">
    <img src="aerialsoccer.jpg" class="w-100 h-100" style="object-fit: cover;" alt="Aerial soccer photo">
    <div class="position-absolute top-50 start-50 translate-middle px-3 w-100">
        <h1>Capturing the Heart of Soccer</h1>
        <!-- jQuery will target this ID -->
        <h2 id="greeting" class="mt-2 fw-bold"></h2>
        <p>Dynamic sports photography by Skye Jimenez</p>
        <a href="gallery.html" class="btn btn-primary mt-3">View Portfolio</a>
    </div>
</header>

<!-- JQUERY FEATURE SECTION -->
<section class="container my-5 text-center">
    <div class="p-5 border rounded shadow-sm bg-light">
        <h3>Gallery </h3>
        <p class="text-muted"> below.</p>
        <button id="event-btn" class="btn btn-dark btn-lg">Click Me</button>
        <!-- jQuery will update this ID -->
        <div id="feedback" class="mt-3 fw-bold" style="display:none;"></div>
    </div>
</section>

<!-- CONTENT -->
<main class="container my-5">
    <h2 class="text-center mb-4">Soccer Photography Highlights</h2>
    <div class="row g-4">
        <div class="col-md-4">
            <img src="soccer1.jpg" class="img-fluid rounded shadow" alt="soccer match">
        </div>
        <div class="col-md-4">
            <img src="soccer10.jpg" class="img-fluid rounded shadow" alt="soccer player">
        </div>
        <div class="col-md-4">
            <img src="soccer11.jpg" class="img-fluid rounded shadow" alt="soccer celebration">
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-4">
    &copy; 2026 Skye Jimenez Photography
</footer>

<!-- IMPORTANT: SCRIPT LOADING ORDER -->

<!-- 1. Load jQuery first (required for your script to work) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- 2. Load your custom script second -->
<script src="script.js"></script>

<!-- 3. Load Bootstrap last -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
